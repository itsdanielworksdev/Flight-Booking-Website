<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - SkyWings</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to SkyWings homepage.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page-404 { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; background:var(--cream); position:relative; }
    .error-page-404 .plane-icon { font-size:5rem; color:var(--secondary); margin-bottom:20px; animation: planeFloat404 3s ease-in-out infinite; }
    @keyframes planeFloat404 { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-20px) rotate(5deg)} }
    .error-page-404 h1 { font-size: clamp(6rem,15vw,10rem); font-weight:900; color:var(--primary); line-height:1; margin-bottom:4px; letter-spacing:-0.05em; }
    .error-page-404 h1 span { color:var(--secondary); }
    .error-page-404 h2 { font-size: clamp(1.3rem,3vw,1.8rem); font-weight:700; color:var(--gray-700); margin-bottom:12px; }
    .error-page-404 p { color:var(--gray-500); max-width:420px; margin-bottom:32px; font-size:0.95rem; line-height:1.7; }
    .error-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    .error-page-404::before { content:''; position:absolute; inset:0; background: radial-gradient(ellipse 60% 50% at 30% 40%, rgba(200,162,69,0.05) 0%, transparent 60%), radial-gradient(ellipse 50% 40% at 70% 60%, rgba(45,125,210,0.03) 0%, transparent 50%); pointer-events:none; }
    .search-suggestions { margin-top:24px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
    .search-suggestions a { padding:6px 16px; border-radius:var(--radius-full); background:var(--gray-100); color:var(--gray-600); font-size:0.8rem; transition:all var(--transition-fast); }
    .search-suggestions a:hover { background:var(--secondary); color:var(--primary); }
  </style>
</head>
<body>
  <div class="error-page-404">
    <div class="plane-icon"><i class="fas fa-plane"></i></div>
    <h1>4<span>0</span>4</h1>
    <h2>Lost in the Clouds</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on course.</p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-secondary btn-lg"><i class="fas fa-home"></i> Go Home</a>
      <a href="flights.html" class="btn btn-light btn-lg"><i class="fas fa-search"></i> Search Flights</a>
    </div>
    <div class="search-suggestions">
      <span style="font-size:0.8rem;color:var(--gray-400);width:100%;margin-bottom:4px">Popular destinations:</span>
      <a href="flights.html?from=LOS&to=DXB">Lagos → Dubai</a>
      <a href="flights.html?from=LOS&to=LHR">Lagos → London</a>
      <a href="flights.html?from=LOS&to=CDG">Lagos → Paris</a>
      <a href="flights.html?from=ABV&to=LOS">Abuja → Lagos</a>
    </div>
  </div>
</body>
</html>
